name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is set to: $JAVA_HOME"
          java -version
          
          # Detect active Java major version
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VERSION" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          
          echo "Detected Java Major Version: $JAVA_VERSION"
          if [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java version is lower than 17."
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "debug.keystore not found. Generating a temporary one..."
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi
          
          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore created successfully."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: The expected debug APK ($APK_PATH) is missing."
            echo "Searching app/build/outputs/apk/ directory:"
            find app/build/outputs/apk -type f -name "*.apk" || echo "Directory not found or empty."
            exit 1
          fi
          
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: The APK file exists but is empty."
            exit 1
          fi
          echo "Debug APK verified successfully at $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_DIR="/tmp/release-asset"
          mkdir -p "$TEMP_DIR"
          
          # Sanitize repository name
          SAFE_REPO_NAME=$(basename "${{ github.repository }}" | tr -cd '[:alnum:]-')
          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          RELEASE_ASSET_PATH="${TEMP_DIR}/${RELEASE_FILENAME}"
          
          cp "$APK_PATH" "$RELEASE_ASSET_PATH"
          echo "Asset prepared at: $RELEASE_ASSET_PATH"
          echo "release_asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "release_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          RELEASE_ASSET_PATH="${{ steps.prepare_asset.outputs.release_asset_path }}"
          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "Error: Release asset is missing or empty before release creation."
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          # Write release notes to a temporary file
          cat <<EOF > /tmp/release-notes.txt
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          
          * **Run Number:** ${{ github.run_number }}
          * **Run Attempt:** ${{ github.run_attempt }}
          * **Source Commit:** ${{ github.sha }}
          
          ⚠️ **Note:** The APK is intended for testing. The APK is not a Play Store production release. The APK is signed only with a temporary debug keystore.
          EOF
          
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release-notes.txt \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            
            echo "✅ GitHub Release published successfully."
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: ${{ steps.prepare_asset.outputs.release_filename }}"
            
            echo "### ✅ APK Build and Release Successful" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded directly from the release Assets section:" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **[Download from GitHub Release]($RELEASE_URL)**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "💡 *Note: The normal Actions artifact (\`app-debug-apk\`) is also available as a backup.*" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ WARNING: GitHub Release publishing failed."
            echo "The APK build succeeded, but the release could not be created."
            echo "The Actions artifact named 'app-debug-apk' remains available."
            
            echo "### ⚠️ APK Built, but Release Failed" >> $GITHUB_STEP_SUMMARY
            echo "The APK build succeeded, but publishing the GitHub Release failed." >> $GITHUB_STEP_SUMMARY
            echo "You can still download the APK from the backup workflow artifacts:" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Download the \`app-debug-apk\` artifact from this workflow run.**" >> $GITHUB_STEP_SUMMARY
          fi
