name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is set to: $JAVA_HOME"
          java -version
          
          # Detect active Java major version
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VERSION" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          
          echo "Detected Java Major Version: $JAVA_VERSION"
          if [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java version is lower than 17."
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "debug.keystore not found. Generating a temporary one..."
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi
          
          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore created successfully."

      - name: Build the debug APK and AAB
        run: gradle :app:assembleDebug :app:bundleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: The expected debug APK ($APK_PATH) is missing."
            echo "Searching app/build/outputs/apk/ directory:"
            find app/build/outputs/apk -type f -name "*.apk" || echo "Directory not found or empty."
            exit 1
          fi
          
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: The APK file exists but is empty."
            exit 1
          fi
          echo "Debug APK verified successfully at $APK_PATH"

      - name: Verify the AAB
        run: |
          AAB_PATH="app/build/outputs/bundle/debug/app-debug.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "Error: The expected debug AAB ($AAB_PATH) is missing."
            exit 1
          fi
          
          if [ ! -s "$AAB_PATH" ]; then
            echo "Error: The AAB file exists but is empty."
            exit 1
          fi
          echo "Debug AAB verified successfully at $AAB_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload debug AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          AAB_PATH="app/build/outputs/bundle/debug/app-debug.aab"
          TEMP_DIR="/tmp/release-asset"
          mkdir -p "$TEMP_DIR"
          
          # Sanitize repository name
          SAFE_REPO_NAME=$(basename "${{ github.repository }}" | tr -cd '[:alnum:]-')
          RELEASE_APK_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          RELEASE_AAB_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.aab"
          
          RELEASE_APK_PATH="${TEMP_DIR}/${RELEASE_APK_FILENAME}"
          RELEASE_AAB_PATH="${TEMP_DIR}/${RELEASE_AAB_FILENAME}"
          
          cp "$APK_PATH" "$RELEASE_APK_PATH"
          cp "$AAB_PATH" "$RELEASE_AAB_PATH"
          
          echo "Assets prepared at: $RELEASE_APK_PATH and $RELEASE_AAB_PATH"
          echo "release_apk_path=$RELEASE_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "release_aab_path=$RELEASE_AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "release_apk_filename=$RELEASE_APK_FILENAME" >> "$GITHUB_OUTPUT"
          echo "release_aab_filename=$RELEASE_AAB_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          RELEASE_APK_PATH="${{ steps.prepare_asset.outputs.release_apk_path }}"
          RELEASE_AAB_PATH="${{ steps.prepare_asset.outputs.release_aab_path }}"
          
          if [ ! -f "$RELEASE_APK_PATH" ] || [ ! -s "$RELEASE_APK_PATH" ]; then
            echo "Error: Release APK is missing or empty before release creation."
            exit 1
          fi
          
          if [ ! -f "$RELEASE_AAB_PATH" ] || [ ! -s "$RELEASE_AAB_PATH" ]; then
            echo "Error: Release AAB is missing or empty before release creation."
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          # Write release notes to a temporary file
          cat <<EOF > /tmp/release-notes.txt
          This is an automatically generated debug APK and AAB.
          The files were built by GitHub Actions.
          
          * **Run Number:** ${{ github.run_number }}
          * **Run Attempt:** ${{ github.run_attempt }}
          * **Source Commit:** ${{ github.sha }}
          
          ⚠️ **Note:** These files are intended for testing. They are not Play Store production releases. They are signed only with a temporary debug keystore.
          EOF
          
          gh release create "$RELEASE_TAG" "$RELEASE_APK_PATH" "$RELEASE_AAB_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release-notes.txt \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            
            echo "✅ GitHub Release published successfully."
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: ${{ steps.prepare_asset.outputs.release_apk_filename }}"
            echo "AAB Asset Filename: ${{ steps.prepare_asset.outputs.release_aab_filename }}"
            
            echo "### ✅ APK Build and Release Successful" >> $GITHUB_STEP_SUMMARY
            echo "The APK and AAB can be downloaded directly from the release Assets section:" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **[Download from GitHub Release]($RELEASE_URL)**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "💡 *Note: The normal Actions artifacts (\`app-debug-apk\` and \`app-debug-aab\`) are also available as backups.*" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ WARNING: GitHub Release publishing failed."
            echo "The APK/AAB build succeeded, but the release could not be created."
            echo "The Actions artifacts named 'app-debug-apk' and 'app-debug-aab' remain available."
            
            echo "### ⚠️ Files Built, but Release Failed" >> $GITHUB_STEP_SUMMARY
            echo "The build succeeded, but publishing the GitHub Release failed." >> $GITHUB_STEP_SUMMARY
            echo "You can still download the files from the backup workflow artifacts:" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Download the artifacts from this workflow run.**" >> $GITHUB_STEP_SUMMARY
          fi
